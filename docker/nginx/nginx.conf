# Nginx serves the built SPA and reverse-proxies the API.
#
# Production HTTPS: terminate TLS here with a Let's Encrypt certificate issued by
# Certbot (see docs/fases/fase-0-fundaciones-y-auth.md). For local development
# this listens on plain HTTP.

server {
    listen 80;
    server_name _;

    # Allow large phone-photo uploads (recibo + carnet). Default is only 1 MB.
    client_max_body_size 40M;

    # API → FastAPI container. The SPA calls paths under /api (VITE_API_URL=/api).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded receipt/carnet images (served by the API). Lets Excel image links resolve.
    location /media/ {
        proxy_pass http://api:8000/media/;
        proxy_set_header Host $host;
    }

    # Hashed build assets are immutable -> cache them hard.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA entry: never cache index.html, so new deploys are picked up immediately.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
