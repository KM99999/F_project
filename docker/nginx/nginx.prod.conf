# Production nginx config: HTTPS with Let's Encrypt + reverse proxy to the API.
#
# Replace __DOMAIN__ with your real domain before deploying (see runbook).
# This config requires the certificate to already exist at
# /etc/letsencrypt/live/__DOMAIN__/ — issue it first with certbot (runbook step 5).

# HTTP :80 — serves the ACME challenge and redirects everything else to HTTPS.
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS :443 — serves the SPA and proxies the API.
server {
    listen 443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Allow large phone-photo uploads (recibo + carnet).
    client_max_body_size 40M;

    # API → FastAPI container. SPA calls paths under /api (VITE_API_URL=/api).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded receipt/carnet images (served by the API). Lets Excel image links resolve.
    location /media/ {
        proxy_pass http://api:8000/media/;
        proxy_set_header Host $host;
    }

    # Static SPA assets with client-side routing fallback.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
